# remote-serial-pico configuration.
#
# `sudo remote-serial-pico install` copies this file to <root>/config.yaml,
# replacing @ROOT@ with the install root (default /opt/remote-serial-pico, or
# whatever --root was given) and @BIND@ with the network interface the Picos
# reach this Pi on. It is written once and never overwritten, so edit the
# installed copy freely. PtyServer, the udev-run provisioning scripts and the
# CLI all read that one file; no path below is repeated anywhere else.
#
# Flat `key: value` only: the installer and the Python scripts read this file
# without a YAML library.

# --- state: owned by the service user, never regenerated, back these up -------
# USB serial id -> friendly port name. Edit by hand to name a board.
PicoSerialMap: '@ROOT@/data/pico_serial_map.yaml'
# Per-device keys, one `<serial id>: '<key>'` per line, written by the deployer
# each time a board is plugged in. Mode 0600, never logged.
PicoSecrets: '@ROOT@/data/pico_secrets.yaml'
# What PtyServer last saw of each board (firmware version, connected or not).
# Written by PtyServer, read by `remote-serial-pico status`.
StateFile: '@ROOT@/data/state.json'
# Where the serial ports appear: <symlinkDir>/<name> -> /dev/pts/N
symlinkDir: '@ROOT@/ports'

# --- root-owned: udev runs code as root against these -------------------------
# MicroPython UF2 cache, and the auto-flash kill switch (autoflash-enabled).
FirmwareDir: '@ROOT@/firmware'
# Log of the provisioning scripts (flasher and deployer).
DeployerLog: '@ROOT@/log/deployer.log'

# --- logging -------------------------------------------------------------------
SyslogDir: '/dev/log'
CustomlogDir: '@ROOT@/data/ptyserver.log'

# --- network -------------------------------------------------------------------
# Port the Picos connect to. The deployer writes this into each board's
# config.json, so changing it here is enough; re-plug the boards afterwards.
TCP_PORT: 50000
# Where PtyServer listens, and the address the deployer tells each Pico to
# connect to. An interface name (wlan0) is resolved to that interface's IPv4
# address each time the service starts, so a DHCP change needs no edit. An IPv4
# address pins it. 0.0.0.0 listens on every interface, which `doctor` reports
# as a problem: registration is not authenticated yet.
BindAddress: '@BIND@'

# --- boards ---------------------------------------------------------------------
# Every board must prove it holds its device key (PicoSecrets) before it is
# served; there is no setting that turns that off. This one decides what
# happens to an authenticated board whose firmware is not what this Pi would
# deploy (see `remote-serial-pico status`):
#   refuse   turn it away until it is plugged into this Pi again (the default)
#   warn     serve it and log a warning
FirmwareMismatch: refuse
